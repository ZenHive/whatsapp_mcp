# ---------------------------------------------------------------------------
# Phase 7: Contact Resolution & UX
# ---------------------------------------------------------------------------

[[task]]
id = 20
phase = 7
bundle = "contact-resolution"
title = "Resolve LID to Phone Number"
status = "done"
scores = { d = 6, b = 9, u = 9 }
body = """
WhatsApp's newer Linked ID (@lid) format stores contacts as numeric IDs instead of phone numbers, so users couldn't search by phone number for these contacts. Use whatsmeow's GetUserInfo API (via a new /api/resolve-lid bridge endpoint) to resolve @lid JIDs to phone numbers, caching results in a new SQLite contacts table (jid, phone, name, updated_at) to avoid repeated API calls. search_contacts now JOINs with the contacts table; falls back to returning the LID as-is if resolution fails. Task 21 depends on this contacts table existing.
"""
implemented = "as specified in body"
acceptance_criteria = [
  "search_contacts with phone number finds @lid contacts (via contacts table JOIN)",
  "LID->phone mappings are cached in SQLite contacts table",
  "Graceful fallback if resolution fails (returns LID as-is)",
]
files_to_modify = [
  "bridge/main.go",
  "lib/whatsapp_mcp/bridge.ex",
  "lib/whatsapp_mcp/database/contacts.ex",
  "lib/whatsapp_mcp/database.ex",
  "test/support/database_fixtures.ex",
]

