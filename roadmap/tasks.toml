[[task]]
id = 1
phase = 1
bundle = "foundation"
title = "Add HTTP Client and Switch Database Schema"
status = "done"
scores = { d = 3, b = 5, u = 5 }
body = """
Add the Req HTTP client library and update the database module to read from the Go bridge's messages.db instead of the native macOS database. New schema: chats table (jid, name, last_message_time), messages table (id, chat_jid, sender, content, timestamp, is_from_me, media_type, filename). Migrated from unscored roadmap.md entry, default score, not re-evaluated.
"""
implemented = "as specified in body"
acceptance_criteria = [
  "mix deps.get succeeds with Req installed",
  "list_chats returns data from Go bridge's messages.db",
  "get_messages works with new schema",
  "search_messages works with new schema",
  "All existing tests pass (or are updated)",
]
